.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:inherit}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0}
.asof{font-size:11px;opacity:.65}

/* ===== A: dark terminal ===== */

.va nav{position:sticky;top:46px;background:#0d1117ee;border-bottom:1px solid #21262d;padding:12px 0;z-index:5}

.va .hero{padding:72px 0 48px}
.va .prompt{color:#3fb950;font-size:14px}
.va h1{font-size:44px;color:#f0f6fc;margin:10px 0}
.va .tag{font-size:18px;color:#58a6ff;max-width:640px;line-height:1.6}
.va .btns{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}
.va .btn{border:1px solid #3fb950;color:#3fb950;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:14px}
.va .btn:hover{background:#3fb95022}

.va .chip{background:#1f6feb22;color:#58a6ff;border:1px solid #1f6feb55}

.va .tl .it{position:relative;margin-bottom:22px}
.va .tl .it::before{content:"";position:absolute;left:-27px;top:6px;width:10px;height:10px;border-radius:50%;background:#3fb950}
.va .tl .d{font-size:12px;color:#8b949e}.va .tl .o{color:#f0f6fc;font-size:16px}.va .tl .b{font-size:14px;margin-top:4px;line-height:1.6}
.va footer{padding:48px 0;color:#8b949e;font-size:13px;border-top:1px solid #21262d;margin-top:48px}

/* ===== B: light analytics ===== */

.vb .hero{padding:64px 0 28px}

 const n=t(D.ui.nav);
 return `<div class="va"><nav><div class="wrap"><a href="#a-p">${n[0]}</a><a href="#a-e">${n[1]}</a><a href="#a-s">${n[2]}</a><a href="#a-c">${n[3]}</a></div></nav>
 <div class="wrap"><section class="hero"><div class="prompt">$ whoami</div><h1>${t(D.name)}</h1><div class="tag">${t(D.role)} — ${t(D.tag)}</div>
 <div class="btns"><a class="btn" href="#a-p">${t(D.ui.projects)}</a><a class="btn" href="https://${D.gh}">GitHub</a><a class="btn" href="mailto:${D.email}">Email</a></div></section>
 <h2 id="a-p">${t(D.ui.projects)}</h2>
 ${D.projects.map(p=>`<div class="card ${S.open[p.id]?"open":""}" data-open="${p.id}"><h3>${t(p.title)}<span class="pm" style="transition:.15s">+</span></h3><div class="sub">${t(p.sub)}</div>
  <div class="det">${p.metrics.length?`<p style="color:#3fb950">${p.metrics.map(m=>m.v+" "+t(m.l)+asof(m)).join(" · ")}</p>`:""}<ul>${p.bullets.map(b=>`<li>${t(b)}</li>`).join("")}</ul><div style="margin-top:10px">${chips(p.tech)}</div>
  <div style="margin-top:10px;font-size:13px">${p.link?`<a href="https://${p.link}" style="color:#3fb950">→ ${t(D.ui.github)}</a>`:`<span style="color:#8b949e">${t(D.ui.soon)}</span>`}</div></div></div>`).join("")}
 <h2>${t(D.ui.more)}</h2><ul style="padding-left:20px;line-height:1.9;font-size:14px">${D.more.map(m=>`<li>${t(m)}</li>`).join("")}</ul>
 <h2 id="a-e">${t(D.ui.exp)}</h2><div class="tl">${D.tl.map(i=>`<div class="it"><div class="d">${fmt(i.d)}</div><div class="o">${t(i.o)} · ${t(i.r)}</div><div class="b">${t(i.b)}</div></div>`).join("")}</div>
 <h2 id="a-s">${t(D.ui.skills)}</h2>${D.skills.map(s=>`<div style="margin-bottom:10px"><span style="color:#8b949e;font-size:13px">${t(s.l)}</span><br>${chips(s.i)}</div>`).join("")}<div style="font-size:13px;color:#8b949e">${t(D.ai)}</div>
 <footer id="a-c">${D.email} · ${D.gh}</footer></div></div>`;
}

function vB(){
 const n=t(D.ui.nav), f=t(D.ui.filt), keys=["all","work","edu","proj","award"];
 const rows=D.tl.filter(i=>S.filter==="all"||i.k===S.filter);
 return `<div class="vb"><nav><div class="wrap"><b>${t(D.name)}</b><a href="#b-p">${n[0]}</a><a href="#b-e">${n[1]}</a><a href="#b-s">${n[2]}</a><a href="#b-c">${n[3]}</a></div></nav>
 <div class="wrap"><section class="hero"><h1>${t(D.role)}</h1><div class="tag">${t(D.tag)}</div>
 <div class="tiles"><div class="tile"><b>2,433</b><span>${S.l==="zh"?"不重複職缺已處理":"unique postings processed"} <span class="asof">(${t(D.ui.asof)})</span></span></div>
 <div class="tile"><b>6x</b><span>${S.l==="zh"?"實習中訓練效率提升":"training speedup during internship"}</span></div>
 <div class="tile"><b>99.84%</b><span>${S.l==="zh"?"惡意網址分類準確率":"malicious-URL classifier accuracy"}</span></div>
 <div class="tile"><b>Top 15</b><span>${S.l==="zh"?"2024 郵政大數據競賽（100+ 隊）":"2024 Postal Big Data (100+ teams)"}</span></div></div></section>
 <h2 id="b-p">${t(D.ui.projects)}</h2><div class="grid">${D.projects.map(p=>`<div class="pc"><small>${p.id==="jf"?"AUTOMATION · LLM":p.id==="wf"?"MACHINE LEARNING":p.id==="rag"?"LLM · RAG":"DEEP LEARNING"}</small><h3>${t(p.title)}</h3><p>${t(p.sub)}</p>
  ${p.metrics.length?`<div class="m">${p.metrics.map(m=>`<div><b>${m.v}</b>${t(m.l)}${asof(m)}</div>`).join("")}</div>`:`<p>${t(p.bullets[1])}</p>`}
  <div>${chips(p.tech)}</div><p style="margin:12px 0 0;font-size:13px">${p.link?`<a href="https://${p.link}" style="color:#0b6bcb">${t(D.ui.github)} →</a>`:`<span style="color:#94a3b8">${t(D.ui.soon)}</span>`}</p></div>`).join("")}</div>
 <button class="more" data-more="1">${S.more?"− ":"+ "}${t(D.ui.more)} (5)</button><div class="morelist ${S.more?"show":""}">${D.more.map(m=>`<div class="row" style="grid-template-columns:1fr">${t(m)}</div>`).join("")}</div>
 <h2 id="b-e">${t(D.ui.exp)}</h2><div class="filters">${keys.map((k,i)=>`<button data-f="${k}" class="${S.filter===k?"on":""}">${f[i]}</button>`).join("")}</div>
 ${rows.map(i=>`<div class="row"><div class="d">${fmt(i.d)}</div><div><div class="o">${t(i.o)}</div><div class="r">${t(i.r)}</div><div class="b">${t(i.b)}</div></div></div>`).join("")}
 <h2 id="b-s">${t(D.ui.skills)}</h2>${D.skills.map(s=>`<div style="margin-bottom:10px"><b style="font-size:13px;color:#64748b">${t(s.l)}</b><br>${chips(s.i)}</div>`).join("")}
 <footer id="b-c">${D.email} · ${D.gh}</footer></div></div>`;
}

function vC(){
 const p=D.projects[S.pick];
 return `<div class="vc"><div class="shell"><aside><h1>${t(D.name)}</h1><div class="tag"><b>${t(D.role)}</b><br>${t(D.tag)}</div>
 <a href="mailto:${D.email}">${D.email}</a><a href="https://${D.gh}">${D.gh}</a></aside>
 <main><h2>${t(D.ui.projects)}</h2><div class="split"><div class="list">${D.projects.map((q,i)=>`<button data-pick="${i}" class="${S.pick===i?"on":""}">${t(q.title)}</button>`).join("")}</div>
  <div class="detail"><h3>${t(p.title)}</h3><div class="sub">${t(p.sub)}</div>
  ${p.metrics.length?`<div class="big">${p.metrics.map(m=>`<div><b>${m.v}</b><span>${t(m.l)}${m.asof?" · "+t(D.ui.asof):""}</span></div>`).join("")}</div>`:""}
  <ul>${p.bullets.map(b=>`<li>${t(b)}</li>`).join("")}</ul><div style="margin-top:16px">${chips(p.tech)}</div>
  <p style="margin-top:14px;font-size:13px;font-family:system-ui">${p.link?`<a href="https://${p.link}" style="color:#9a3b1b">${t(D.ui.github)} →</a>`:`<span style="color:#8a7a66">${t(D.ui.soon)}</span>`}</p></div></div>
 <h2>${t(D.ui.skills)}</h2><div class="bento">${D.skills.map(s=>`<div><h4>${t(s.l)}</h4><p>${s.i.join(" · ")}</p></div>`).join("")}</div>
 <h2>${t(D.ui.exp)}</h2>${D.tl.map(i=>`<div class="yr"><div class="d">${fmt(i.d)}</div><div>${t(i.o)}<small>${t(i.r)} — ${t(i.b)}</small></div></div>`).join("")}
 <h2 style="margin-top:48px">${t(D.ui.more)}</h2>${D.more.map(m=>`<div class="yr" style="grid-template-columns:1fr">${t(m)}</div>`).join("")}</main></div></div>`;
}

function render(){
 const y=window.scrollY;
 document.documentElement.lang=S.l==="zh"?"zh-Hant":"en";
 document.querySelectorAll("#bar .tab").forEach(b=>b.classList.toggle("on",b.dataset.v===S.v));
 document.querySelectorAll("#bar .lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.l));
 document.getElementById("note").textContent=t(NOTES[S.v]);
 document.getElementById("stage").innerHTML={A:vA,B:vB,C:vC}[S.v]();
 window.scrollTo(0,y);
}
document.addEventListener("click",e=>{
 const g=(k)=>e.target.closest(`[data-${k}]`);
 let x;
 if(x=g("v")){S.v=x.dataset.v;localStorage.setItem("dv",S.v);window.scrollTo(0,0)}
 else if(x=g("l")){S.l=x.dataset.l;localStorage.setItem("dl",S.l)}
 else if(x=g("open")){S.open[x.dataset.open]=!S.open[x.dataset.open]}
 else if(x=g("f")){S.filter=x.dataset.f}
 else if(x=g("pick")){S.pick=+x.dataset.pick}
 else if(g("more")){S.more=!S.more}
 else return;
 render();
});
render();
</script>
</body>
</html>
